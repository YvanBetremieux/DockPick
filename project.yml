name: DockPick
options:
  bundleIdPrefix: io.github.yvanbetremieux
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "DockPick Self-Signed"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    MACOSX_DEPLOYMENT_TARGET: "14.0"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"
targets:
  DockPick:
    type: application
    platform: macOS
    sources: [DockPick]
    dependencies:
      - package: Sparkle
    info:
      path: DockPick/Resources/Info.plist
      properties:
        CFBundleName: DockPick
        CFBundleDisplayName: DockPick
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "© 2026 Yvan Betremieux"
        SUFeedURL: https://github.com/YvanBetremieux/DockPick/releases/latest/download/appcast.xml
        SUPublicEDKey: "qECeEDPNAY1XJ14UI1bJjDGfK5piTv6hFZ8/3Wp6W00="
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
    entitlements:
      path: DockPick/Resources/DockPick.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.yvanbetremieux.DockPick
        PRODUCT_NAME: DockPick
  DockPickTests:
    type: bundle.unit-test
    platform: macOS
    sources: [DockPickTests]
    dependencies:
      - target: DockPick
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.yvanbetremieux.DockPickTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  DockPick:
    build:
      targets:
        DockPick: all
        DockPickTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [DockPickTests]
    archive:
      config: Release
